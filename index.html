<style>
:root{--bg:#eef7f4;--c:#fff;--t:#14313a;--m:#4a6168;--p:#0a7c72;--p2:#075b55;--a:#f5a40c;--b:#cde3dd;--ok:#14804a;--wn:#a15f00;--bd:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.8 Tajawal,Tahoma,Arial,sans-serif}
header{background:var(--p);color:#fff;text-align:center;padding:8px 16px 12px;border-radius:0 0 20px 20px}
.eyebrow{font-size:11.5px;line-height:1.5;font-weight:500;opacity:.9}.orn{display:none}
h1{font:800 20px/1.4 Tajawal,Tahoma,sans-serif;margin:0;color:#fff}
.sub{font-size:13.5px;opacity:.92;max-width:560px;margin:auto}
.disc{background:#e1f1f5;border:1px solid #b5d8e2;color:#25495a;font-size:13.5px;line-height:1.7;border-radius:16px;padding:10px 14px;margin:14px auto 0;width:calc(100% - 28px);max-width:692px;box-sizing:border-box}
nav{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:720px;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--c);border-top:1px solid var(--b);border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(8,70,66,.14)}
nav:empty{display:none}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;padding:6px 2px;border:0;border-radius:16px;background:transparent;color:var(--m);font:inherit;font-size:12.5px;font-weight:700;line-height:1.3;text-align:center;white-space:normal}
nav button::before{font-size:23px;line-height:1}
nav button:nth-child(1)::before{content:"🏅"}nav button:nth-child(2)::before{content:"📁"}nav button:nth-child(3)::before{content:"📊"}nav button:nth-child(4)::before{content:"🌱"}nav button:nth-child(5)::before{content:"👤"}
nav button.on{background:var(--p);color:#fff}
main{max-width:720px;margin:auto;padding:6px 14px calc(120px + env(safe-area-inset-bottom,0px))}
.card{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 4px 14px rgba(8,70,66,.07)}
.card>b{display:block;color:var(--p2);font-size:19px;font-weight:800;margin-bottom:2px}
input,select,textarea{width:100%;box-sizing:border-box;min-height:52px;padding:12px 14px;border:2px solid var(--b);border-radius:14px;background:#fff;color:var(--t);font:inherit;margin:6px 0 10px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--a);outline-offset:2px;border-color:var(--p)}
.btn{display:block;background:var(--p);color:#fff;border:0;border-radius:16px;min-height:54px;padding:12px 16px;font:inherit;font-size:18px;font-weight:800;width:100%;margin-top:8px;box-shadow:0 4px 0 var(--p2);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--p2)}
.btn.g{background:#fff;color:var(--p);border:2px solid var(--p);box-shadow:none}
.btn.big{background:var(--a);color:#3b2600;font-size:22px;min-height:66px;box-shadow:0 5px 0 #b87800}
.row{display:flex;gap:10px}.row .btn{flex:1}
.bar{height:14px;background:var(--b);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.tag{font-size:12.5px;background:#fde8b4;color:#5a3a00;border-radius:8px;padding:2px 10px;margin-inline-start:6px;font-weight:700}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:6px}
.ok{background:var(--ok)}.wn{background:var(--wn)}.bd{background:var(--bd)}.gy{background:var(--b)}
label.r{display:flex;gap:10px;align-items:flex-start;padding:9px 0;font-size:16px}label.r input{width:24px;height:24px;min-height:0;margin:3px 0 0;accent-color:var(--p);flex:none}
small{color:var(--m)}.card>small{display:block;font-size:14.5px;line-height:1.75;margin-top:6px}
#t{position:fixed;inset-inline:0;bottom:calc(96px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--t);color:#fff;font-size:16px;padding:12px 20px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.hero{background:var(--c);border:1px solid var(--b);border-radius:26px;padding:26px 18px 22px;margin:16px 0;text-align:center;box-shadow:0 10px 28px rgba(8,70,66,.12)}
.hero .ic{font-size:56px;line-height:1.1}
.hero h2{font:800 26px/1.5 Tajawal,Tahoma,sans-serif;color:var(--p2);margin:6px 0 8px}
.hero p{margin:0 0 16px;color:var(--m)}
.pts,.steps{list-style:none;padding:0;margin:0;display:grid;gap:9px;text-align:start}.pts{margin-bottom:20px}
.pts li{background:#e6f5f0;border-radius:14px;padding:11px 14px;font-weight:700;color:var(--p2)}
.hero h3{font:800 18px Tajawal,Tahoma,sans-serif;margin:26px 0 10px}
.steps{counter-reset:s}.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;font-size:16.5px}
.steps li::before{content:counter(s,arabic-indic);flex:none;width:36px;height:36px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
